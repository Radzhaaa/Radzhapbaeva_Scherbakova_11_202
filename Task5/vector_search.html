<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Векторный Поиск — TF-IDF v2</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #6e9ec8;
    --accent2: #c8a96e;
    --accent3: #6ec8a9;
    --text: #e8e4dc;
    --muted: #6b6880;
    --success: #6ec8a9;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Playfair Display', serif;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    padding: 3rem 4rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 2rem;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: 'VECTOR';
    position: absolute;
    right: -1rem;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--serif);
    font-size: 9rem;
    font-weight: 900;
    color: #1a1a28;
    letter-spacing: -0.05em;
    pointer-events: none;
    user-select: none;
  }

  .logo-num {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 0.4rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    font-family: var(--mono);
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    min-height: calc(100vh - 130px);
  }

  .search-panel {
    padding: 3rem 4rem;
    border-right: 1px solid var(--border);
  }

  .section-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .query-wrap {
    position: relative;
    margin-bottom: 1.5rem;
  }

  #queryInput {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem 1.5rem;
    padding-right: 7rem;
    color: var(--text);
    font-family: var(--mono);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.02em;
  }

  #queryInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110, 158, 200, 0.08), 0 0 20px rgba(110, 158, 200, 0.05);
  }

  #queryInput::placeholder { color: var(--muted); }

  /* Autocomplete */
  .autocomplete-wrap { position: relative; }

  #suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    z-index: 100;
    overflow: hidden;
    display: none;
  }

  .suggestion-item {
    padding: 0.55rem 1.2rem;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .suggestion-item:hover, .suggestion-item.active {
    background: rgba(110, 158, 200, 0.1);
    color: var(--accent);
  }

  .suggestion-prefix { color: var(--accent); font-weight: 600; }
  .suggestion-rest { color: var(--muted); }

  #searchBtn {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    border-radius: 3px;
    padding: 0.55rem 1.2rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  #searchBtn:hover { background: #84b4d4; }
  #searchBtn:active { transform: translateY(-50%) scale(0.97); }

  .examples { margin-bottom: 2.5rem; }

  .example-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2px solid var(--border);
    padding: 0.6rem 1rem;
    margin-bottom: 0.4rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .example-item:hover {
    color: var(--text);
    border-left-color: var(--accent);
    background: rgba(110, 158, 200, 0.04);
  }

  .results-section { margin-top: 1rem; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .result-count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .result-count span {
    color: var(--success);
    font-size: 1.4rem;
    font-weight: 600;
    display: block;
    margin-bottom: 0.1rem;
  }

  .result-grid { display: grid; gap: 0.8rem; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem 1.5rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    animation: slideIn 0.25s ease both;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .result-card:hover { border-color: rgba(110, 158, 200, 0.3); }
  .result-card:hover::before { opacity: 1; }

  .doc-icon {
    width: 52px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }

  .doc-icon-box {
    width: 36px;
    height: 36px;
    background: rgba(110, 158, 200, 0.08);
    border: 1px solid rgba(110, 158, 200, 0.15);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .doc-rank {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .doc-info { flex: 1; }

  .doc-name {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 0.35rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .doc-preview {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 0.6rem;
  }

  .doc-preview mark {
    background: rgba(110, 158, 200, 0.2);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 2px;
  }

  /* Score bar */
  .score-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .score-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .score-val {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--accent3);
    min-width: 3.5rem;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
  }

  .empty-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    opacity: 0.4;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Right panel — top terms */
  .index-panel {
    padding: 2rem;
    background: var(--surface);
    overflow-y: auto;
    max-height: calc(100vh - 130px);
    position: sticky;
    top: 0;
  }

  .tfidf-table { width: 100%; }

  .tfidf-row {
    display: grid;
    grid-template-columns: 1fr auto 80px;
    gap: 0.5rem;
    align-items: center;
    padding: 0.45rem 0;
    border-bottom: 1px solid rgba(30, 30, 46, 0.8);
    animation: fadeIn 0.2s ease both;
  }

  .tfidf-term {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    cursor: pointer;
    transition: color 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tfidf-term:hover { color: #84b4d4; }

  .tfidf-score {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }

  .mini-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .mini-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }

  .panel-info {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 1rem;
    line-height: 1.6;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo-num">// ИНФ. ПОИСК · v2.0</div>
    <h1>Векторный <span>Поиск</span></h1>
    <p class="subtitle">TF-IDF · Косинусное сходство · Ранжирование</p>
  </div>
</header>

<div class="layout">
  <!-- Left: Search -->
  <div class="search-panel">

    <div class="section-label">Поисковый запрос</div>

    <div class="query-wrap autocomplete-wrap">
      <input id="queryInput" type="text"
        placeholder="Например: цезарь клеопатра"
        autocomplete="off" spellcheck="false"
        oninput="onInput()"
        onkeydown="onKeyDown(event)"
        onblur="setTimeout(hideSuggestions, 150)"

      <button id="searchBtn" onclick="runSearch()">НАЙТИ</button>
      <div id="suggestions"></div>
    </div>

    <div class="section-label">Примеры запросов</div>
    <div class="examples">
      <button class="example-item" onclick="setQuery('цезарь клеопатра')">цезарь клеопатра</button>
      <button class="example-item" onclick="setQuery('антоний цицерон')">антоний цицерон</button>
      <button class="example-item" onclick="setQuery('помпей гражданская война')">помпей гражданская война</button>
      <button class="example-item" onclick="setQuery('египет царица союз')">египет царица союз</button>
      <button class="example-item" onclick="setQuery('оратор республика рим')">оратор республика рим</button>
    </div>

    <div class="results-section">
      <div id="resultsArea">
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <div>Введите запрос и нажмите НАЙТИ</div>
          <div style="margin-top:0.5rem;opacity:0.6">Документы ранжируются по косинусному сходству</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Query TF-IDF weights -->
  <div class="index-panel">
    <div class="section-label" style="margin-bottom:0.8rem;">Веса запроса</div>
    <div class="panel-info" id="panelInfo">Здесь отобразятся TF-IDF веса слов запроса после поиска.</div>
    <div id="tfidfTable" class="tfidf-table"></div>
  </div>
</div>

// Простые русские стоп-слова
const STOPWORDS = new Set([
  'и','в','на','с','по','за','от','до','из','к','у','о','об','не','но','а','же',
  'то','как','так','это','все','она','он','они','оно','её','его','их','где','что',
  'был','была','было','были','для','при','под','над','та','те','тот','той','ним',
  'него','ней','нём','тем','там','тут','уже','ещё','или','да','нет','вот','вся',
  'весь','когда','также','того','той','после','одним','из','её','ней','него'
]);

// ─── Обработка текста ─────────────────────────────────────────────────────────
function tokenize(text) {
  const matches = text.toLowerCase().match(/[а-яёa-z]+/g) || [];
  return matches
    .filter(t => !STOPWORDS.has(t) && t.length > 1)
    .map(t => lemmatize(t));  // лемматизируем каждый токен
}

// ─── TF ───────────────────────────────────────────────────────────────────────
function computeTF(tokens) {
  const tf = {};
  const total = tokens.length;
  if (total === 0) return tf;
  for (const t of tokens) tf[t] = (tf[t] || 0) + 1;
  for (const t in tf) tf[t] /= total;
  return tf;
}

// ─── Построение индекса (IDF + TF-IDF векторы) ───────────────────────────────
function buildIndex() {
  const docTokens = {};
  for (const [id, text] of Object.entries(DOCS)) {
    docTokens[id] = tokenize(text);
  }

  const N = Object.keys(docTokens).length;

  // DF
  const df = {};
  for (const tokens of Object.values(docTokens)) {
    for (const t of new Set(tokens)) df[t] = (df[t] || 0) + 1;
  }

  // IDF (сглаженное: log(1 + N/df) — чтобы частые слова не обнулялись)
  const idf = {};
  for (const t in df) idf[t] = Math.log(1 + N / df[t]);

  // TF-IDF векторы документов
  const docVectors = {};
  for (const [id, tokens] of Object.entries(docTokens)) {
    const tf = computeTF(tokens);
    const vec = {};
    for (const t in tf) vec[t] = tf[t] * (idf[t] || 0);
    docVectors[id] = vec;
  }

  return { idf, docVectors };
}

// ─── Косинусное сходство ──────────────────────────────────────────────────────
function cosineSim(a, b) {
  let dot = 0, normA = 0, normB = 0;
  for (const k in b) dot += (a[k] || 0) * b[k];
  for (const v of Object.values(a)) normA += v * v;
  for (const v of Object.values(b)) normB += v * v;
  if (normA === 0 || normB === 0) return 0;
  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

// ─── Поиск ────────────────────────────────────────────────────────────────────
function vectorSearch(query, idf, docVectors) {
  const qTokens = tokenize(query);
  if (qTokens.length === 0) return { results: [], queryVec: {} };

  const tf = computeTF(qTokens);
  const queryVec = {};
  for (const t in tf) queryVec[t] = tf[t] * (idf[t] || 0);

  const results = [];
  for (const [id, vec] of Object.entries(docVectors)) {
    const score = cosineSim(queryVec, vec);
    if (score > 0) results.push({ id, score });
  }
  results.sort((a, b) => b.score - a.score);
  return { results, queryVec };
}

// ─── Инициализация ────────────────────────────────────────────────────────────
const { idf, docVectors } = buildIndex();

// ─── UI ───────────────────────────────────────────────────────────────────────
function highlightTerms(text, terms) {
  let result = text;
  for (const t of terms) {
    if (!t || t.length < 2) continue;
    const re = new RegExp(`(${t})`, 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  }
  return result;
}

function runSearch() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query) return;

  const { results, queryVec } = vectorSearch(query, idf, docVectors);
  const qTerms = tokenize(query);
  const area = document.getElementById('resultsArea');

  // Обновляем панель весов
  renderQueryWeights(queryVec);

  if (results.length === 0) {
    area.innerHTML = `
      <div class="result-header">
        <div class="result-count"><span>0</span>документов найдено</div>
      </div>
      <div class="empty-state" style="padding:2rem 0">
        <div class="empty-icon">◌</div>
        <div>Документов по запросу не найдено</div>
        <div style="margin-top:0.5rem;opacity:0.6">Попробуйте другие слова</div>
      </div>`;
    return;
  }

  const maxScore = results[0].score;
  const plural = n => n === 1 ? '' : n < 5 ? 'а' : 'ов';

  const cards = results.map(({ id, score }, i) => {
    const raw = DOCS[id] || '';
    const preview = highlightTerms(raw.slice(0, 160) + (raw.length > 160 ? '…' : ''), qTerms);
    const docNum = id.replace('doc', '').replace('.txt', '');
    const pct = ((score / maxScore) * 100).toFixed(1);
    return `
      <div class="result-card" style="animation-delay:${i * 0.06}s">
        <div class="doc-icon">
          <div class="doc-icon-box">DOC<br>${docNum}</div>
          <div class="doc-rank">#${i + 1}</div>
        </div>
        <div class="doc-info">
          <div class="doc-name">${id}</div>
          <div class="doc-preview">${preview}</div>
          <div class="score-row">
            <div class="score-bar-wrap">
              <div class="score-bar" style="width:${pct}%"></div>
            </div>
            <div class="score-val">sim = ${score.toFixed(4)}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  area.innerHTML = `
    <div class="result-header">
      <div class="result-count"><span>${results.length}</span>документ${plural(results.length)} найдено</div>
    </div>
    <div class="result-grid">${cards}</div>`;
}

function renderQueryWeights(queryVec) {
  const table = document.getElementById('tfidfTable');
  const info = document.getElementById('panelInfo');

  const entries = Object.entries(queryVec)
    .filter(([, v]) => v > 0)
    .sort(([, a], [, b]) => b - a);

  if (entries.length === 0) {
    info.textContent = 'Слова запроса не найдены в корпусе (IDF = 0).';
    table.innerHTML = '';
    return;
  }

  const maxW = entries[0][1];
  info.textContent = `Уникальных термов: ${entries.length}`;

  table.innerHTML = entries.map(([term, weight]) => {
    const pct = ((weight / maxW) * 100).toFixed(1);
    return `
      <div class="tfidf-row">
        <div class="tfidf-term" onclick="appendTerm('${term}')">${term}</div>
        <div class="tfidf-score">${weight.toFixed(4)}</div>
        <div class="mini-bar-wrap"><div class="mini-bar" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');
}

function appendTerm(term) {
  const inp = document.getElementById('queryInput');
  const cur = inp.value.trim();
  inp.value = cur ? cur + ' ' + term : term;
  inp.focus();
}

function setQuery(q) {
  document.getElementById('queryInput').value = q;
  runSearch();
}

// ─── Список всех лемм для автодополнения ─────────────────────────────────────
const ALL_LEMMAS = [...new Set(Object.values(LEMMA_MAP))].sort();

let activeSuggestion = -1;

function getLastWord(val) {
  const parts = val.split(/\s+/);
  return parts[parts.length - 1].toLowerCase();
}

function replaceLastWord(val, replacement) {
  const parts = val.split(/\s+/);
  parts[parts.length - 1] = replacement;
  return parts.join(' ');
}

function showSuggestions(prefix) {
  const box = document.getElementById('suggestions');
  if (!prefix || prefix.length < 1) { hideSuggestions(); return; }
  const matches = ALL_LEMMAS.filter(l => l.startsWith(prefix)).slice(0, 8);
  if (matches.length === 0) { hideSuggestions(); return; }
  activeSuggestion = -1;
  box.innerHTML = matches.map((m, i) => `
    <div class="suggestion-item" data-val="${m}" onmousedown="pickSuggestion('${m}')">
      <span class="suggestion-prefix">${prefix}</span><span class="suggestion-rest">${m.slice(prefix.length)}</span>
    </div>`).join('');
  box.style.display = 'block';
}

function hideSuggestions() {
  document.getElementById('suggestions').style.display = 'none';
  activeSuggestion = -1;
}

function pickSuggestion(val) {
  const inp = document.getElementById('queryInput');
  inp.value = replaceLastWord(inp.value, val) + ' ';
  hideSuggestions();
  inp.focus();
  runSearch();
}

function onInput() {
  const inp = document.getElementById('queryInput');
  const lastWord = getLastWord(inp.value);
  showSuggestions(lastWord);
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    if (inp.value.trim().length >= 2) runSearch();
  }, 300);
}

function onKeyDown(e) {
  const box = document.getElementById('suggestions');
  const items = box.querySelectorAll('.suggestion-item');
  if (box.style.display === 'none' || items.length === 0) {
    if (e.key === 'Enter') { runSearch(); }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeSuggestion = Math.min(activeSuggestion + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeSuggestion = Math.max(activeSuggestion - 1, -1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeSuggestion >= 0) pickSuggestion(items[activeSuggestion].dataset.val);
    else { hideSuggestions(); runSearch(); }
    return;
  } else if (e.key === 'Escape') {
    hideSuggestions(); return;
  }
  items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestion));
}

let liveTimer = null;
</script>
